features:
- max 120MHz
- 128KByte Flash
- 32KByte SRAM
- Three low-power modes, include sleep, stop, power down.
- Supports peripheral event triggering
- ADC, DAC, CMP
- 3 HRPWM, total 10 Timer, one RTC, two WDT
- up to 10 communication interfaces (USART*4, SPI*1, I2C*1, MCAN*2)
- Data encryption, AES/HASH.TRNG
features_zh:
- 主频最大120MHz
- 128KByte Flash
- 32KByte SRAM
- 三种低功耗模式，sleep，stop，power down
- 支持外设事件相互触发
- 高性能模拟，ADC, DAC, CMP
- 3 路 HRPWM，共计10个timer，一个RTC，2个看门狗
- 最大10个通信接口(4个USART, 1个SPI, 1个I2C, 2个MCAN)
- 数据加密，AES/HASH.TRNG
